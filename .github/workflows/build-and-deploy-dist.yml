name: 构建油猴脚本并发布到 GitHub Releases

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建 + 发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 1/7 检出源码（master 分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 2/7 设置 Node.js 22.x（LTS，避开 Node 20 废弃）
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          corepack: true

      - name: 3/7 安装 pnpm（双保险：packageManager + 显式 version）
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          version: 10.30.1
          run_install: false

      - name: 4/7 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile=false

      - name: 5/7 构建油猴脚本产物（完整版本：含 Vue 注入）
        id: build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          echo "--- dist 目录清单 ---"
          ls -lah dist
          echo "--- 脚本头关键字段检查 ---"
          head -n 30 dist/rup-tampermonkey.user.js
          # 把版本号输出到后续步骤可用（从 package.json 读取，vite 就是用它写进脚本头）
          VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo ">>> VERSION = $VERSION"

      - name: 5.1/7 上传 Actions 产物（可选手动下载用，90 天留存）
        uses: actions/upload-artifact@v4
        with:
          name: rup-tampermonkey.user.js
          path: dist/rup-tampermonkey.user.js
          if-no-files-found: error
          retention-days: 90

      - name: 6/7 生成精简 meta.user.js（只含头，用于 Tampermonkey @updateURL 比对版本；体积 ~2KB）
        id: meta
        shell: bash
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          META_OUT=meta.user.js

          # 从 dist/rup-tampermonkey.user.js 提取 "// ==UserScript== ... // ==/UserScript==" 的头块
          # 这一段正是 Tampermonkey 需要的元信息，不含任何打包代码 / Vue 代码
          awk '
            /^\/\/ ==UserScript==/ { in_block = 1 }
            in_block { print }
            /^\/\/ ==\/UserScript==/ { in_block = 0; exit }
          ' dist/rup-tampermonkey.user.js > "$META_OUT"

          echo ">>> 生成的 meta.user.js 内容（头 30 行）："
          head -n 30 "$META_OUT"
          echo ">>> meta.user.js 大小："
          wc -c "$META_OUT" || ls -lah "$META_OUT"

          # 同时把 meta.user.js 复制到 dist/ 目录，便于 Release 步骤统一从 dist/ 上传 assets
          cp -v "$META_OUT" "dist/$META_OUT"

          echo "meta_file=$META_OUT" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=RUP Tampermonkey v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 7/7 发布到 GitHub Releases（assets 携带完整脚本 + 精简 meta）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          # 生成 release body（中文），包含版本信息 + 更新指引
          body: |
            ## RUP 油猴脚本 ${{ steps.meta.outputs.tag_name }}

            由 GitHub Actions 自动构建并发布（来源 commit：${{ github.sha }}）

            ### 📦 下载安装
            | 文件 | 说明 |
            |------|------|
            | `rup-tampermonkey.user.js` | **完整脚本（推荐直接安装）**，双击/拖入篡改猴即可安装 |
            | `meta.user.js` | **仅头信息（update/updateURL 用）**，Tampermonkey 定时拉它比对 `@version` 决定是否更新；体积仅 ~2 KB |

            ### 🔗 自动更新说明
            安装过本脚本的用户：
            - 篡改猴会定时读取 `meta.user.js` 头的 `@version`（通过脚本头 `@updateURL`）
            - 版本更高则自动后台更新 / 弹窗提示更新
            - 也可以在篡改猴仪表盘 → RUP 脚本 → 右键「查找更新」手动触发

            ### 🧭 仓库
            主页：${{ github.server_url }}/${{ github.repository }}
            Releases：${{ github.server_url }}/${{ github.repository }}/releases
          files: |
            dist/rup-tampermonkey.user.js
            dist/meta.user.js
          # 如果 tag 已存在就覆盖对应 Release 的 assets（避免重复 tag 报错）
          fail_on_unmatched_files: true
          make_latest: true
