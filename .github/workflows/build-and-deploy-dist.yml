name: 构建油猴脚本并部署到 dist 分支

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 构建 + 部署 dist
    runs-on: ubuntu-latest

    steps:
      - name: 1/6 检出源码（master 分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 2/6 设置 Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 3/6 安装 pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          run_install: false

      - name: 4/6 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile=false

      - name: 5/6 构建油猴脚本产物
        shell: bash
        id: build
        run: |
          set -euo pipefail
          pnpm build
          echo "--- dist 目录清单 ---"
          ls -lah dist
          echo "--- 脚本头关键字段检查 ---"
          head -n 25 dist/rup-tampermonkey.user.js

      - name: 5.1/6 上传 Actions 产物（可选手动下载用）
        uses: actions/upload-artifact@v4
        with:
          name: rup-tampermonkey.user.js
          path: dist/rup-tampermonkey.user.js
          if-no-files-found: error
          retention-days: 90

      - name: 6/6 推送 dist/ 到 dist 分支（git worktree，路径可控）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 6.1 准备部署临时目录（结构：/README.md + /dist/rup-tampermonkey.user.js）
          mkdir -p /tmp/deploy-root/dist
          cp dist/rup-tampermonkey.user.js /tmp/deploy-root/dist/rup-tampermonkey.user.js

          # 写 README.md 到部署目录（printf 逐行写，避免 YAML + Bash Heredoc 嵌套导致的 YAML 语法歧义）
          RD=/tmp/deploy-root/README.md
          {
            printf '# RUP Tampermonkey - 脚本分发分支（自动部署，请勿手动修改）\n\n'
            printf '该分支（`dist`）存储 RUP Tampermonkey 油猴脚本的**自动构建产物**，\n'
            printf '供 Tampermonkey / Violentmonkey / 篡改猴 读取并自动更新。\n\n'
            printf '源代码 / 问题反馈 / 功能需求 请到 master 分支：\n'
            printf '  https://github.com/%s\n\n' "$GITHUB_REPO"
            printf '脚本自动更新直链：\n'
            printf '  https://raw.githubusercontent.com/%s/dist/dist/rup-tampermonkey.user.js\n\n' "$GITHUB_REPO"
            printf '文件位置：\n'
            printf '  - dist/rup-tampermonkey.user.js\n'
          } > "$RD"

          # 6.2 git 作者信息
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 6.3 拉取 dist 分支（远端不存在时新建 orphan 分支）
          set +e
          git show-ref --verify --quiet "refs/remotes/origin/dist"
          HAS_DIST=$?
          set -e
          if [ "$HAS_DIST" = "0" ]; then
            echo ">>> 远端 dist 分支存在，检出到临时 worktree"
            git worktree add -B dist /tmp/dist-wt origin/dist
          else
            echo ">>> 远端 dist 分支不存在，新建 orphan 工作区"
            git worktree add --detach /tmp/dist-wt
            cd /tmp/dist-wt
            git checkout --orphan dist
            git reset --hard
            cd - >/dev/null
          fi

          # 6.4 用构建产物覆盖 worktree（保留 git 元信息）
          find /tmp/dist-wt -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -R /tmp/deploy-root/. /tmp/dist-wt/

          # 6.5 构造 commit 消息（写文件再 git commit -F，彻底规避 Bash HERE-DOC 与 YAML 缩进冲突）
          cd /tmp/dist-wt
          git add -A
          if git diff --cached --quiet; then
            echo ">>> dist 分支内容无变更，跳过 commit"
          else
            VERSION_LINE="unknown"
            if [ -f dist/rup-tampermonkey.user.js ]; then
              VERSION_LINE=$(head -n 20 dist/rup-tampermonkey.user.js | grep -E '^//\s*@version' || echo "@version unknown")
            fi
            CM=/tmp/dist-wt/.commit-msg.txt
            {
              printf 'deploy: 分发油猴脚本 %s (%s)\n\n' "$VERSION_LINE" "${BUILD_COMMIT:0:7}"
              printf '由 GitHub Actions 自动构建并部署到 dist 分支\n'
              printf '来源 commit: %s\n' "$BUILD_COMMIT"
            } > "$CM"
            git commit -F "$CM"
            rm -f "$CM"
          fi

          # 6.6 用 GITHUB_TOKEN + x-access-token 凭据推送 dist:dist
          AUTH_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
          git push "$AUTH_REPO" dist:dist
