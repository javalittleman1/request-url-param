name: 构建油猴脚本并部署到 dist 分支

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 构建 + 部署 dist
    runs-on: ubuntu-latest

    steps:
      - name: 1/6 检出源码（master 分支）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: 2/6 设置 Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 3/6 安装 pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-install
        with:
          run_install: false

      - name: 4/6 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile=false

      - name: 5/6 构建油猴脚本产物
        shell: bash
        id: build
        run: |
          set -euo pipefail
          pnpm build
          echo "--- dist 目录清单 ---"
          ls -lah dist
          echo "--- 脚本头关键字段检查 ---"
          head -n 25 dist/rup-tampermonkey.user.js

      - name: 5.1/6 上传 Actions 产物（可选手动下载用）
        uses: actions/upload-artifact@v4
        with:
          name: rup-tampermonkey.user.js
          path: dist/rup-tampermonkey.user.js
          if-no-files-found: error
          retention-days: 90

      # ★ 关键：用 git worktree 把 dist/ 目录结构（dist/rup-tampermonkey.user.js）
      #    直接推到独立的 dist 分支根目录下的 dist/ 子目录。
      #    这样 @updateURL =
      #    https://raw.githubusercontent.com/javalittleman1/request-url-param/dist/dist/rup-tampermonkey.user.js
      #    分支 = dist  |  路径 = dist/rup-tampermonkey.user.js   → 完美匹配，100% 可预测
      - name: 6/6 推送 dist/ 到 dist 分支（手动 git worktree，路径可控）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_VERSION: ${{ steps.build.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 6.1 准备部署临时目录，结构 = dist/ 原路径
          mkdir -p /tmp/deploy-root/dist
          cp dist/rup-tampermonkey.user.js /tmp/deploy-root/dist/rup-tampermonkey.user.js
          cp LICENSE README.md README_EN.md /tmp/deploy-root/ 2>/dev/null || true
          cat > /tmp/deploy-root/README.md <<'EOF'
          # RUP Tampermonkey - 脚本分发分支（自动部署，请勿手动修改）

          该分支（`dist`）存储 [RUP Tampermonkey 油猴脚本](https://github.com/javalittleman1/request-url-param)
          的**自动构建产物**，供 Tampermonkey / Violentmonkey / 篡改猴 读取并自动更新。

          文件位置：
            - 脚本：[dist/rup-tampermonkey.user.js](./dist/rup-tampermonkey.user.js)

          脚本自动更新直链：
            https://raw.githubusercontent.com/javalittleman1/request-url-param/dist/dist/rup-tampermonkey.user.js

          源代码 / 问题反馈 / 功能需求 请到 master 分支：
            https://github.com/javalittleman1/request-url-param
          EOF

          # 6.2 git 作者信息
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 6.3 拉取 dist 分支（如果远端不存在则新建 --orphan）
          set +e
          git show-ref --verify --quiet "refs/remotes/origin/dist"
          HAS_DIST=$?
          set -e
          if [ "$HAS_DIST" = "0" ]; then
            echo ">>> 远端 dist 分支存在，检出到临时 worktree"
            git worktree add -B dist /tmp/dist-wt origin/dist
          else
            echo ">>> 远端 dist 分支不存在，新建 orphan 工作区"
            git worktree add --detach /tmp/dist-wt
            cd /tmp/dist-wt
            git checkout --orphan dist
            git reset --hard
            cd - >/dev/null
          fi

          # 6.4 用构建产物覆盖 /tmp/dist-wt 的内容（保留 git 元信息）
          find /tmp/dist-wt -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -R /tmp/deploy-root/. /tmp/dist-wt/

          # 6.5 commit & push
          cd /tmp/dist-wt
          git add -A
          if git diff --cached --quiet; then
            echo ">>> dist 分支内容无变更，跳过 commit"
          else
            VERSION_LINE=$(head -n 20 dist/rup-tampermonkey.user.js | grep -E '^//\s*@version' || echo "@version unknown")
            MSG=$(cat <<EOF
deploy: 分发油猴脚本 ${VERSION_LINE} (${BUILD_COMMIT:0:7})

由 GitHub Actions 自动构建并部署到 dist 分支
来源 commit: ${BUILD_COMMIT}
EOF
)
            git commit -m "$MSG"
          fi
          # 用 token 写回远端（GITHUB_TOKEN + HTTPS）
          AUTH_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$AUTH_REPO" dist:dist
